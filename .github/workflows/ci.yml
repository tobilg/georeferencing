name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reused by release.yml so that releases publish exactly what CI verified.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12'

jobs:
  # Lint, types, unit tests and npm package contents
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Built once here; the *:prebuilt scripts below reuse dist/ instead of rebuilding.
      - name: Build packages
        run: pnpm build:packages

      - name: Type check
        run: pnpm typecheck:prebuilt

      - name: Unit tests
        run: pnpm test

      - name: Pack and verify package contents
        run: pnpm release:check:prebuilt

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: artifacts/georeferencing-*.tgz
          if-no-files-found: error
          retention-days: 7

      # The demo is deployed on release; build it here so every change proves it builds.
      - name: Build demo
        run: pnpm build:demo:prebuilt

      - name: Upload demo site
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: packages/demo/dist
          if-no-files-found: error
          retention-days: 7

  # Playwright tests against the demo and harness, one engine per job so they run in parallel
  browser:
    name: browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps ${{ matrix.project }}

      - name: Browser tests
        run: pnpm test:browser --project=${{ matrix.project }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results
          retention-days: 7

  # Clean applications installed from the packed tarballs
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pdfinfo
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Consumer tests
        run: pnpm test:consumer

  # Strict TypeDoc build, link and search checks; the output is deployed on release
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and check documentation
        run: pnpm test:docs

      - name: Upload documentation site
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: packages/documentation/dist
          if-no-files-found: error
          retention-days: 7
